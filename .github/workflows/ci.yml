name: Validate source and installation
permissions:
  contents: read
on:
  push:
  pull_request:
jobs:
  backend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
          cache-dependency-path: backend/requirements*.txt
      - run: python -m pip install -r backend/requirements-dev.txt
      - run: python -m ruff check app tests scripts ../scripts
        working-directory: backend
      - run: python -m pytest -q
        working-directory: backend
  frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
        working-directory: frontend
      - run: npm run build
        working-directory: frontend
      - run: npm audit
        working-directory: frontend
  docker:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - variant: quickstart
            compose: /tmp/docsync-compose-ci/docker-compose.yml
          - variant: mysql
            compose: docker-compose.mysql.yml
    env:
      COMPOSE_FILE: ${{ matrix.compose }}
      DOCSYNC_REF: ${{ github.sha }}
    steps:
      - uses: actions/checkout@v4
      - run: |
          mkdir -p /tmp/docsync-compose-ci
          cp docker-compose.yml /tmp/docsync-compose-ci/docker-compose.yml
      - if: matrix.variant == 'mysql'
        run: python3 scripts/init_config.py --mode docker
      - run: docker compose config --quiet
      - run: docker compose up -d --build --wait --wait-timeout 300
      - if: matrix.variant == 'mysql'
        run: docker compose exec -T api python -m app.cli setup --username ci_admin --password 'OnlyForEphemeralCi123!'
      - run: docker compose exec -T api python -m app.cli check
      - if: matrix.variant == 'quickstart'
        run: docker compose exec -T api python -m scripts.verify_quickstart
      - if: matrix.variant == 'quickstart'
        run: |
          docker compose down
          docker compose up -d --wait --wait-timeout 300
          docker compose exec -T api python -m scripts.verify_quickstart
      - run: curl --fail http://localhost:8090/health
      - if: matrix.variant == 'quickstart'
        run: docker run --rm -v "$PWD/deploy/linux/nginx.conf:/etc/nginx/conf.d/default.conf:ro" nginx:stable-alpine nginx -t
      - if: failure()
        run: docker compose logs --tail 100 api web
      - if: always()
        run: docker compose down
