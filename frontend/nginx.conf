server {
    listen 80;
    server_name _;
    absolute_redirect off;

    root /usr/share/nginx/html;
    index index.html;

    gzip on;
    gzip_min_length 1k;
    gzip_types text/plain text/css application/json application/javascript application/xml image/svg+xml;
    gzip_vary on;

    # ---------------- 缓存策略 ----------------
    #
    # 这里以前**什么都没有**，于是浏览器按默认启发式缓存 —— 结果是：
    # Vite 打包出的 index.html **不带内容哈希**，一旦被缓存住，它就一直指向
    # 旧的那份 index-xxxx.js。表现就是「我明明更新了，页面还是老样子」，
    # 刷新没用、重启容器也没用，只能强制刷新 —— 而且没人知道要这么做。
    #
    # 正确的分工：
    #   /assets/*   文件名带哈希，内容变了名字就变 → 可以永久缓存
    #   index.html  是「指向当前版本的指针」，绝不缓存 → 每次都回源校验
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, max-age=31536000, immutable";
        access_log off;
        try_files $uri =404;
    }

    location = /index.html {
        add_header Cache-Control "no-cache, no-store, must-revalidate";
        add_header Pragma "no-cache";
        expires -1;
    }

    # 前端是 history 模式，刷新子路径要落回 index.html。
    # 这条同时也兜住「没有扩展名的路由」—— 它们同样不能缓存。
    location / {
        try_files $uri $uri/ /index.html;
        add_header Cache-Control "no-cache, no-store, must-revalidate";
    }

    location /api/ {
        proxy_pass http://api:8000;
        proxy_http_version 1.1;
        proxy_set_header Host $http_host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 300s;
        proxy_send_timeout 300s;
    }

    # 实时日志是 SSE，必须关掉缓冲，否则日志会攒着一次性吐出来
    location /api/v1/runs {
        proxy_pass http://api:8000;
        proxy_http_version 1.1;
        proxy_set_header Host $http_host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_buffering off;
        proxy_cache off;
        proxy_read_timeout 3600s;
        chunked_transfer_encoding on;
    }

    location /health {
        proxy_pass http://api:8000/health;
    }
}
